server:
  port: ${SERVER_PORT:9999}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

file:
  upload:
    path: ${FILE_UPLOAD_PATH:./uploads}
    allowed-extensions: ${FILE_UPLOAD_ALLOWED_EXTENSIONS:txt,md}

milvus:
  host: ${MILVUS_HOST:localhost}
  port: ${MILVUS_PORT:19530}
  username: ${MILVUS_USERNAME:}
  password: ${MILVUS_PASSWORD:}
  database: ${MILVUS_DATABASE:default}
  timeout: ${MILVUS_TIMEOUT:10000}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
      chat:
        options:
          timeout: 180000
      retry:
        max-attempts: 3
        backoff:
          initial-interval: 2000
          multiplier: 2
          max-interval: 10000
    mcp:
      client:
        enabled: ${MCP_CLIENT_ENABLED:false}
        name: tencent-mcp-server
        version: 1.0.0
        request-timeout: 60s
        type: ASYNC
        stdio:
          connections:
            tencent-cls:
              command: ${MCP_TENCENT_CLS_STDIO_COMMAND:node}
              args:
                - ${MCP_TENCENT_CLS_STDIO_ARG0:scripts/cls-mcp-stdio-wrapper.js}
              env:
                TRANSPORT: ${MCP_TENCENT_CLS_TRANSPORT:stdio}
                TENCENTCLOUD_SECRET_ID: ${TENCENTCLOUD_SECRET_ID:}
                TENCENTCLOUD_SECRET_KEY: ${TENCENTCLOUD_SECRET_KEY:}
                TENCENTCLOUD_API_BASE_HOST: ${TENCENTCLOUD_API_BASE_HOST:tencentcloudapi.com}
                TZ: ${MCP_TENCENT_CLS_TZ:Asia/Shanghai}


dashscope:
  api:
    key: ${DASHSCOPE_API_KEY:}
  embedding:
    model: text-embedding-v4

document:
  chunk:
    max-size: 800
    overlap: 100

rag:
  top-k: 3
  model: "qwen3-max"
  eval:
    enabled: ${RAG_EVAL_ENABLED:false}
    dataset: ${RAG_EVAL_DATASET:eval/rag-eval.jsonl}
    output: ${RAG_EVAL_OUTPUT:target/rag-eval-report.json}
    top-k: ${RAG_EVAL_TOP_K:3}
    fail-fast: ${RAG_EVAL_FAIL_FAST:false}
  rerank:
    enabled: true
    model: "qwen3-rerank"
    endpoint: "https://dashscope.aliyuncs.com/compatible-api/v1/reranks"
    candidate-top-k: 20
    timeout-seconds: 30
    instruct: ""

kcs:
  enabled: true
  path: ./uploads/kcs
  review-path: ./uploads/kcs-review
  index-resolved: true

prometheus:
  base-url: ${PROMETHEUS_BASE_URL:http://localhost:9090}
  timeout: ${PROMETHEUS_TIMEOUT:10}
  mock-enabled: ${PROMETHEUS_MOCK_ENABLED:false}

cls:
  mock-enabled: ${CLS_MOCK_ENABLED:false}
  secret-id: ${TENCENTCLOUD_SECRET_ID:}
  secret-key: ${TENCENTCLOUD_SECRET_KEY:}
  endpoint: ${TENCENT_CLS_ENDPOINT:cls.tencentcloudapi.com}
  default-region: ${TENCENT_CLS_DEFAULT_REGION:ap-guangzhou}
  default-lookback-minutes: ${TENCENT_CLS_DEFAULT_LOOKBACK_MINUTES:30}
  topic-ids:
    system-metrics: ${TENCENT_CLS_TOPIC_SYSTEM_METRICS:${CLS_TOPIC_SYSTEM_METRICS:}}
    application-logs: ${TENCENT_CLS_TOPIC_APPLICATION_LOGS:${CLS_TOPIC_APPLICATION_LOGS:}}
    database-slow-query: ${TENCENT_CLS_TOPIC_DATABASE_SLOW_QUERY:${CLS_TOPIC_DATABASE_SLOW_QUERY:}}
    system-events: ${TENCENT_CLS_TOPIC_SYSTEM_EVENTS:${CLS_TOPIC_SYSTEM_EVENTS:}}
    default: ${TENCENT_CLS_TOPIC_DEFAULT:${CLS_TOPIC_DEFAULT:}}

agent:
  memory:
    path: ${AGENT_MEMORY_PATH:data/agent-memory/memory-store.json}
