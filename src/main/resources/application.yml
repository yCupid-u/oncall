server:
  port: ${SERVER_PORT:9999}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

file:
  upload:
    path: ${FILE_UPLOAD_PATH:./uploads}
    allowed-extensions: ${FILE_UPLOAD_ALLOWED_EXTENSIONS:txt,md}

milvus:
  host: ${MILVUS_HOST:localhost}
  port: ${MILVUS_PORT:19530}
  username: ${MILVUS_USERNAME:}
  password: ${MILVUS_PASSWORD:}
  database: ${MILVUS_DATABASE:default}
  timeout: ${MILVUS_TIMEOUT:10000}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
      chat:
        options:
          timeout: 180000
      retry:
        max-attempts: 3
        backoff:
          initial-interval: 2000
          multiplier: 2
          max-interval: 10000
    mcp:
      client:
        enabled: ${MCP_CLIENT_ENABLED:false}
        name: tencent-mcp-server
        version: 1.0.0
        request-timeout: 60s
        type: ASYNC
        sse:
          connections:
            tencent-cls:
              url: ${MCP_TENCENT_CLS_URL:https://mcp-api.tencent-cloud.com}
              sse-endpoint: ${MCP_TENCENT_CLS_SSE_ENDPOINT:}

dashscope:
  api:
    key: ${DASHSCOPE_API_KEY:}
  embedding:
    model: text-embedding-v4

document:
  chunk:
    max-size: 800
    overlap: 100

rag:
  top-k: 3
  model: "qwen3-max"
  rerank:
    enabled: true
    model: "qwen3-rerank"
    endpoint: "https://dashscope.aliyuncs.com/compatible-api/v1/reranks"
    candidate-top-k: 20
    timeout-seconds: 30
    instruct: ""

kcs:
  enabled: true
  path: ./uploads/kcs
  review-path: ./uploads/kcs-review
  index-resolved: true

prometheus:
  base-url: ${PROMETHEUS_BASE_URL:http://localhost:9090}
  timeout: ${PROMETHEUS_TIMEOUT:10}
  mock-enabled: ${PROMETHEUS_MOCK_ENABLED:false}

cls:
  mock-enabled: ${CLS_MOCK_ENABLED:false}
